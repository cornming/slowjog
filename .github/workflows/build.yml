name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 版本號自動遞增：versionCode 用這個 workflow 的執行編號，versionName 為 0.1.<執行編號>。
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整歷史與標籤，才能產生這次版本的更新日誌

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 單元測試並建置 debug APK
        run: ./gradlew test assembleDebug -PappVersionCode=${VERSION_CODE} -PappVersionName=${VERSION_NAME} --stacktrace

      - name: 重新命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "slowjog-v${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: slowjog-v${{ env.VERSION_NAME }}
          path: slowjog-v${{ env.VERSION_NAME }}.apk

      - name: 發佈 Release（附 APK 與更新日誌）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## 更新內容"
            echo
            git log "$RANGE" --no-merges --pretty='- %s (%h)'
          } > release-notes.md
          gh release create "v${VERSION_NAME}" "slowjog-v${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION_NAME}" \
            --notes-file release-notes.md
